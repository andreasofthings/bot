services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matrix_bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # Mount .env locally for developer overrides
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: matrix_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: botdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d botdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

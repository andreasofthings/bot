[project]
name = "matrix-capability-bot"
version = "0.1.0"
description = "Extensible Matrix multi-capability bot with RSS relevance filtering, stock TA signals, and lead onboarding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matrix-nio>=0.24.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.1.0",
    "feedparser>=6.0.10",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "pandas>=2.0.0",
    "ta>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
bot = "src.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
